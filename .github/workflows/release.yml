name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run build
      - name: Installer integration (isolated fixtures)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test/installer.integration.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/pack.ps1
      - name: Verify extracted release installation
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-package.ps1
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne $version) { throw "Tag must equal manifest version $version" }
      - uses: actions/upload-artifact@v4
        with:
          name: typora-autocaps
          path: |
            dist/plugin.zip
            dist/typora-autocaps-*-windows.zip
            dist/typora-autocaps-*-source.zip
            dist/SHA256SUMS.txt
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: typora-autocaps
          path: dist
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease --title "Typora AutoCaps $RELEASE_TAG" --notes "See CHANGELOG.md and docs/TESTING.md. Real Typora acceptance is required before stable publication."
